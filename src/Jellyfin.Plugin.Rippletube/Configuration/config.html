<!DOCTYPE html>
<html>
<head>
    <title>Rippletube</title>
</head>
<body>
<div id="rippletubePage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary rippletube">
            <form id="rippletubeConfigForm">
                <h1>Rippletube</h1>
                <div class="sectionTitleContainer">
                    <h2 class="sectionTitle">Configuration</h2>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="ytDlpPath" label="yt-dlp path or command" required />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="ffmpegPath" label="ffmpeg path or command" required />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="destinationFolder" label="Destination library folder" required />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="cookiesFilePath" label="Optional cookies file path" />
                </div>
                <div class="fieldDescription">Cookies must already exist on the Jellyfin server or inside the container.</div>
                <div class="selectContainer">
                    <select is="emby-select" id="formatPreset" label="Format preset">
                        <option value="0">Compatible MP4 preferred</option>
                        <option value="1">Best available</option>
                        <option value="2">Audio only</option>
                        <option value="3">Capped 1080p</option>
                    </select>
                </div>
                <div class="selectContainer">
                    <select is="emby-select" id="namingTemplate" label="Naming template">
                        <option value="0">Uploader / Title [id] / Title.ext</option>
                        <option value="1">Playlist / Index - Title [id].ext</option>
                        <option value="2">Title [id].ext</option>
                    </select>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="maxPlaylistItems" type="number" min="1" max="500" label="Playlist item cap" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="minimumFreeSpaceGb" type="number" min="0" label="Minimum free space (GB)" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" id="historyRetention" type="number" min="10" max="1000" label="History retention" />
                </div>
                <label class="checkboxContainer">
                    <input is="emby-checkbox" id="autoScanLibrary" type="checkbox" />
                    <span>Scan Jellyfin library after successful downloads</span>
                </label>
                <div class="rippletube-actions">
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>Save</span>
                    </button>
                    <button is="emby-button" type="button" id="validateButton" class="raised block">
                        <span>Validate tools</span>
                    </button>
                </div>
            </form>

            <div class="sectionTitleContainer">
                <h2 class="sectionTitle">Download</h2>
            </div>
            <div class="inputContainer">
                <input is="emby-input" id="downloadUrl" label="Video or playlist URL" />
            </div>
            <label class="checkboxContainer">
                <input is="emby-checkbox" id="isPlaylist" type="checkbox" />
                <span>Allow playlist download using configured cap</span>
            </label>
            <div class="rippletube-actions">
                <button is="emby-button" type="button" id="previewButton" class="raised block">
                    <span>Preview</span>
                </button>
                <button is="emby-button" type="button" id="submitButton" class="raised button-submit block">
                    <span>Submit</span>
                </button>
            </div>
            <div id="previewPanel" class="rippletube-panel"></div>
            <div id="messagePanel" class="fieldDescription"></div>

            <div class="sectionTitleContainer">
                <h2 class="sectionTitle">Queue</h2>
            </div>
            <div class="rippletube-actions">
                <button is="emby-button" type="button" id="refreshQueueButton" class="raised block">
                    <span>Refresh queue</span>
                </button>
            </div>
            <div id="queuePanel" class="rippletube-queue"></div>
        </div>
    </div>
    <script src="configurationpage?name=rippletube.js&v=0.1.0.21"></script>
    <link rel="stylesheet" href="configurationpage?name=rippletube.css&v=0.1.0.21" />
</div>
</body>
</html>
